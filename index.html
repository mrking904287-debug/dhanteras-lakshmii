<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#180900">
<title>शुभ धनतेरस – माँ लक्ष्मी</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#180900;color:#fff2b0;font-family:Georgia,"Noto Serif Devanagari",serif}
.scene{position:relative;width:100%;height:100vh;height:100svh;overflow:hidden;isolation:isolate;background:#210d03}
.goddess{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 45%;filter:saturate(1.08) brightness(.91)}
.shade{position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(30,8,0,.58),transparent 29%,transparent 66%,rgba(20,4,0,.76))}
.glow{position:absolute;z-index:2;width:80vw;height:80vw;max-width:560px;max-height:560px;left:50%;top:39%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,200,40,.22),transparent 70%);pointer-events:none}
.greeting{position:absolute;z-index:5;top:5%;left:3%;right:3%;text-align:center;animation:appear 1.2s ease both}
.small{margin:0 0 7px;letter-spacing:4px;font:600 clamp(11px,2.8vw,15px)/1.4 Arial,sans-serif;color:#ffe7a0;text-shadow:0 1px 8px #7b3100}
h1{font-size:clamp(32px,8vw,56px);line-height:1.2;margin:5px 0;color:#fff0a5;text-shadow:0 0 8px #ffb300,0 0 20px #ff8c00,2px 3px 5px #5b1800}
.sub{margin:8px 0 0;font-size:clamp(12px,3.3vw,18px);color:#fff8df;text-shadow:0 2px 8px #000}
.blessing{position:absolute;z-index:5;left:5%;right:5%;bottom:4%;text-align:center;font-size:clamp(13px,3.5vw,19px);line-height:1.6;color:#fff3c5;text-shadow:0 2px 10px #260900,0 0 12px #9b4b00;animation:appear 1.8s ease both}
.blessing strong{display:block;color:#ffdf72;font-size:1.15em}
.coin{position:absolute;top:-35px;z-index:4;color:#ffd54f;font-family:Arial,sans-serif;font-weight:bold;text-shadow:0 0 7px #ffb000,0 0 14px #ff8c00;pointer-events:none;user-select:none;animation:fall linear infinite}
@keyframes fall{0%{transform:translate3d(0,-10vh,0) rotateY(0) rotate(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translate3d(var(--drift),115vh,0) rotateY(720deg) rotate(650deg);opacity:0}}
.spark{position:absolute;z-index:3;width:4px;height:4px;border-radius:50%;background:#fff4a0;box-shadow:0 0 12px 3px gold;animation:shine 1.5s ease-in-out infinite alternate;pointer-events:none}
@keyframes shine{from{opacity:.2;transform:scale(.5)}to{opacity:1;transform:scale(1.7)}}
@keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media (min-aspect-ratio:1/1){.scene{max-width:480px;margin:auto;height:100svh}body{background:#080402}}
@media(max-height:650px){.greeting{top:2%}.blessing{bottom:2%}}
</style>
</head>
<body>

  <div class="shade"></div>
  <div class="glow"></div>

  <header class="greeting">
    <p class="small">॥ श्री महालक्ष्म्यै नमः ॥</p>
    <h1>शुभ धनतेरस</h1>
    <p class="sub">धन, वैभव और सुख-समृद्धि का मंगल पर्व</p>
  </header>

  <div class="blessing">
    माँ लक्ष्मी की कृपा आप और आपके परिवार पर सदैव बनी रहे।
    <strong>धनतेरस की हार्दिक शुभकामनाएँ 🙏✨</strong>
  </div>
</main>

<script>
const scene = document.querySelector(".scene");

// सोने के सिक्कों की लगातार बारिश
for (let i = 0; i < 55; i++) {
  const coin = document.createElement("span");
  coin.className = "coin";
  coin.textContent = i % 3 === 0 ? "₹" : "●";
  coin.style.left = Math.random() * 100 + "%";
  coin.style.fontSize = (12 + Math.random() * 17) + "px";
  coin.style.setProperty("--drift", (Math.random() * 150 - 75) + "px");
  coin.style.animationDuration = (3 + Math.random() * 6) + "s";
  coin.style.animationDelay = (-Math.random() * 9) + "s";
  scene.appendChild(coin);
}

// चमकते हुए सितारे
for (let i = 0; i < 30; i++) {
  const spark = document.createElement("span");
  spark.className = "spark";
  spark.style.left = Math.random() * 100 + "%";
  spark.style.top = Math.random() * 100 + "%";
  spark.style.animationDelay = Math.random() * 2 + "s";
  scene.appendChild(spark);
}
</script>
